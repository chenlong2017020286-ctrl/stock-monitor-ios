name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    name: Build Unsigned IPA
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Create iOS platform files
        run: flutter create --platforms=ios .

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build iOS archive (unsigned)
        run: flutter build ipa --release --no-codesign

      - name: Package IPA from xcarchive
        run: |
          APP_PATH="build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r stock-app.ipa Payload
          mkdir -p build/ios/ipa
          mv stock-app.ipa build/ios/ipa/

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: stock-app-unsigned.ipa
          path: build/ios/ipa/*.ipa
          retention-days: 7
